<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigiaMoz - Contato</title>
    <!-- Recursos compartilhados -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar (Igual às outras páginas) -->
    
    <main class="container py-5">
        <div class="row">
            <div class="col-md-6">
                <h2 class="mb-4">Entre em Contato</h2>
                <form id="formContato">
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Nome Completo" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" rows="5" placeholder="Sua mensagem..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar Mensagem</button>
                </form>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-map-marker-alt"></i> Nossa Localização</h5>
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d114964.38943794635!2d32.56089511093745!3d-25.968677945925395!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1ee69b3a1d16f0d9%3A0x4a5a1e4d4d4d4d4d!2sMaputo!5e0!3m2!1sen!2smz!4v1620000000000!5m2!1sen!2smz" 
                            width="100%" 
                            height="300" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts compartilhados -->
</body>
</html>
