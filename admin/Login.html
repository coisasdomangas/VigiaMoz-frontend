<!DOCTYPE html>
<html lang="pt">
<head>
    <!-- Adicione os recursos do Bootstrap e Font Awesome -->
    <title>VigiaMoz - Admin</title>
    <style>
        .login-box {
            max-width: 400px;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2 class="text-center mb-4"><i class="fas fa-lock"></i> Acesso Restrito</h2>
            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
