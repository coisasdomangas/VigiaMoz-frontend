<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigiaMoz - Segurança Inteligente</title>
    <!-- Recursos externos (Passo 2) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-camera-security"></i> VigiaMoz
            </a>
        </div>
    </nav>

    <!-- Banner Hero -->
    <section class="banner animate__animated animate__fadeIn">
        <div class="container text-center text-white">
            <h1 class="display-4">Proteção 24h para Moçambique</h1>
            <p class="lead">Câmeras Reolink com tecnologia 100% solar</p>
            <a href="pedido.html" class="btn btn-primary btn-lg">
                <i class="fas fa-calendar-check"></i> Agendar Instalação
            </a>
        </div>
    </section>

    <!-- Seção Produtos -->
    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">Nossas Soluções</h2>
            <div class="row">
                <!-- Card 1 -->
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <img src="assets/camera1.jpg" class="card-img-top" alt="Câmera 8K">
                        <div class="card-body">
                            <h5 class="card-title">Câmera Solar 4G</h5>
                            <p class="text-success">Preço: 12.500 MT</p>
                            <button class="btn btn-outline-primary">Comprar</button>
                        </div>
                    </div>
                </div>
                <!-- Adicione mais cards -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>Contacto: +258 84 123 4567</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
